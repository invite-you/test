name: Temporary verified Hermes analysis tool

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  acquire-tool:
    if: github.head_ref == 'meeting-ai-static-analysis-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify hermes-decomp v0.2.1
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output unpacked
          curl -fL --retry 3 --retry-all-errors \
            'https://github.com/SymbioticSec/hermes-decomp/releases/download/v0.2.1/hermes-decomp-v0.2.1-linux-x86_64.tar.gz' \
            -o /tmp/hermes-decomp.tar.gz
          echo 'f10c879e5b63c5fbff66fb57a3dc4a4a8ca226197fb4aaeec0ac2ce67100acb3  /tmp/hermes-decomp.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hermes-decomp.tar.gz -C unpacked
          cp unpacked/hermes-decomp output/hermes-decomp
          chmod +x output/hermes-decomp
          sha256sum output/hermes-decomp > output/hermes-decomp.sha256
          output/hermes-decomp --help > output/hermes-decomp-help.txt
          printf 'SymbioticSec/hermes-decomp v0.2.1 release archive verified against published SHA-256.\n' > output/PROVENANCE.txt
      - name: Upload verified binary
        uses: actions/upload-artifact@v4
        with:
          name: verified-hermes-decomp-v0.2.1-linux-x86_64
          path: output/
          if-no-files-found: error
          retention-days: 2
