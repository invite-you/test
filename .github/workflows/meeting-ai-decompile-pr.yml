name: Meeting.ai decompile and technical analysis

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/meeting-ai-decompile-pr.yml
      - tools/meeting_ai_analyze.py
  push:
    branches: [meeting-ai-static-analysis-20260824]
    paths:
      - .github/workflows/meeting-ai-decompile-pr.yml
      - tools/meeting_ai_analyze.py

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout temporary analysis branch
        uses: actions/checkout@v4

      - name: Install acquisition and reverse-engineering tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            aapt apksigner apktool binutils build-essential clang cmake curl file git jq \
            libcapstone-dev libicu-dev ninja-build p7zip-full pkg-config python3-pip \
            python3-pyelftools python3-requests python3-venv ripgrep tree unzip zip

          python3 -m venv /tmp/goopdl-venv
          /tmp/goopdl-venv/bin/pip install --upgrade pip wheel
          /tmp/goopdl-venv/bin/pip install 'git+https://github.com/Villoh/goopdl.git'
          /tmp/goopdl-venv/bin/goopdl --help >/dev/null

          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -1)"
          test -n "$JADX_URL"
          curl -fL --retry 3 --retry-all-errors "$JADX_URL" -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx /opt/jadx/bin/jadx-gui
          /opt/jadx/bin/jadx --version

      - name: Acquire Google Play package and verify identity
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/apks work/download work/extracted result

          set +e
          timeout 1200 /tmp/goopdl-venv/bin/goopdl info ai.meeting.app --country KR \
            2>&1 | tee result/goopdl_info.log
          timeout 1200 /tmp/goopdl-venv/bin/goopdl latest ai.meeting.app --stable 2 --country KR \
            2>&1 | tee result/goopdl_latest.log
          timeout 1200 /tmp/goopdl-venv/bin/goopdl download ai.meeting.app \
            -o work/apks -a arm64 -l ko --no-extras --country KR \
            2>&1 | tee result/goopdl_download.log
          GOOPDL_STATUS=${PIPESTATUS[0]}
          set -e
          echo "goopdl_status=$GOOPDL_STATUS" | tee result/acquisition_status.txt

          if ! find work/apks -type f -name '*.apk' -print -quit | grep -q .; then
            urls=(
              'https://d.apkpure.net/b/XAPK/ai.meeting.app?version=latest'
              'https://d.apkpure.com/b/XAPK/ai.meeting.app?version=latest'
              'https://d.cdnpure.com/b/XAPK/ai.meeting.app?version=latest'
              'https://d.apkpure.net/b/XAPK/ai.meeting.app?versionCode=1384'
              'https://d.apkpure.com/b/XAPK/ai.meeting.app?versionCode=1384'
              'https://d.apkpure.net/b/APK/ai.meeting.app?version=latest'
              'https://d.apkpure.com/b/APK/ai.meeting.app?version=latest'
            )
            found=''
            for url in "${urls[@]}"; do
              rm -f work/download/package.bin
              if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 1200 \
                -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
                -e 'https://apkpure.net/meeting-ai-ai-visual-notes/ai.meeting.app/download' \
                -H 'Accept: application/octet-stream,application/vnd.android.package-archive,*/*' \
                "$url" -o work/download/package.bin; then
                if unzip -tq work/download/package.bin >/dev/null 2>&1; then
                  found="$url"
                  break
                fi
              fi
            done
            test -n "$found"
            printf '%s\n' "$found" >> result/acquisition_status.txt
            if unzip -Z1 work/download/package.bin | grep -qE '\.apk$'; then
              unzip -q work/download/package.bin -d work/apks
            else
              cp work/download/package.bin work/apks/ai.meeting.app.apk
            fi
          fi

          mapfile -t ALL_APKS < <(find work/apks -type f -name '*.apk' | sort)
          test "${#ALL_APKS[@]}" -gt 0
          printf '%s\n' "${ALL_APKS[@]}" | tee result/apk_paths.txt

          base=''
          : > result/all_apk_badging.txt
          : > result/all_apk_signing.txt
          for apk in "${ALL_APKS[@]}"; do
            echo "===== $apk =====" | tee -a result/all_apk_badging.txt result/all_apk_signing.txt
            aapt dump badging "$apk" 2>&1 | tee -a result/all_apk_badging.txt || true
            apksigner verify --verbose --print-certs "$apk" 2>&1 | tee -a result/all_apk_signing.txt || true
            line="$(aapt dump badging "$apk" 2>/dev/null | head -1 || true)"
            if grep -q "package: name='ai.meeting.app'" <<<"$line" && ! grep -q " split='" <<<"$line"; then
              base="$apk"
            fi
          done
          if [ -z "$base" ]; then
            base="$(find work/apks -type f -name '*.apk' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)"
          fi
          test -n "$base"
          cp "$base" work/base.apk

          aapt dump badging work/base.apk | tee result/aapt_badging.txt
          aapt dump permissions work/base.apk | tee result/aapt_permissions.txt
          apksigner verify --verbose --print-certs work/base.apk | tee result/signing.txt
          sha256sum work/base.apk | tee result/base_sha256.txt
          sha1sum work/base.apk | tee result/base_sha1.txt
          file work/base.apk | tee result/base_file_type.txt

          pkg="$(aapt dump badging work/base.apk | head -1 | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          test "$pkg" = 'ai.meeting.app'

          i=0
          for apk in "${ALL_APKS[@]}"; do
            i=$((i+1))
            dir="work/extracted/$(printf '%03d' "$i")-$(basename "$apk" .apk)"
            mkdir -p "$dir"
            unzip -q "$apk" -d "$dir"
          done

      - name: Decode resources and decompile DEX bytecode
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p work/apktool work/jadx
          apktool d -f work/base.apk -o work/apktool 2>&1 | tee result/apktool.log
          mapfile -t ALL_APKS < <(find work/apks -type f -name '*.apk' | sort)
          /opt/jadx/bin/jadx -j 4 --show-bad-code --no-res \
            -d work/jadx "${ALL_APKS[@]}" 2>&1 | tee result/jadx.log
          find work/jadx/sources -type f 2>/dev/null | sort > result/jadx_source_files.txt || true

      - name: Extract native strings and client-side indicators
        shell: bash
        run: |
          set -euxo pipefail
          : > result/native_strings_all.txt
          while IFS= read -r -d '' f; do
            echo "===== $f =====" >> result/native_strings_all.txt
            timeout 180 strings -a -n 6 "$f" 2>/dev/null \
              | grep -Eai 'https?://|wss?://|([a-z0-9-]+\.)+(com|net|org|io|ai|app|dev|co|cloud|me|xyz|sg|id|tech|site|live|store|services)|meeting|record|audio|transcrib|speaker|voice|diariz|upload|websocket|grpc|summary|calendar|contact|billing|subscription|firebase|sentry|posthog|appsflyer|revenuecat|openai|anthropic|deepseek|bigmodel|speech|token|api' \
              | head -n 250000 >> result/native_strings_all.txt || true
          done < <(find work/extracted -type f \( -name '*.so' -o -name 'classes*.dex' -o -name 'resources.arsc' \) -print0)
          wc -c result/native_strings_all.txt

      - name: Run first-pass code and configuration analysis
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/meeting_ai_analyze.py \
            --base work/base.apk \
            --apks-dir work/apks \
            --apktool work/apktool \
            --jadx work/jadx \
            --extracted work/extracted \
            --out result | tee result/scanner_stdout.log

      - name: Attempt Flutter AOT symbol recovery with Blutter
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p work/flutterlib work/blutter_out
          find work/extracted -type f -path '*/lib/arm64-v8a/*.so' -exec cp -f {} work/flutterlib/ \;
          if [ -f work/flutterlib/libapp.so ] && [ -f work/flutterlib/libflutter.so ]; then
            git clone --depth 1 https://github.com/worawit/blutter.git work/blutter_tool
            timeout 1500 python3 work/blutter_tool/blutter.py work/flutterlib work/blutter_out \
              2>&1 | tee result/blutter.log
          else
            echo 'Flutter ARM64 libapp.so/libflutter.so pair not found; Blutter not applicable.' | tee result/blutter.log
          fi

      - name: Refresh report with Flutter symbol evidence
        shell: bash
        if: always()
        run: |
          set -euxo pipefail
          python3 tools/meeting_ai_analyze.py \
            --base work/base.apk \
            --apks-dir work/apks \
            --apktool work/apktool \
            --jadx work/jadx \
            --extracted work/extracted \
            --out result \
            --blutter work/blutter_out | tee result/scanner_final_stdout.log
          cat result/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Detailed evidence is stored in the workflow artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: Package evidence for manual review
        shell: bash
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p deliverable/raw
          cp -a result deliverable/
          cp -a work/base.apk deliverable/raw/ 2>/dev/null || true
          cp -a work/apks deliverable/raw/ 2>/dev/null || true
          if [ -f work/apktool/AndroidManifest.xml ]; then
            mkdir -p deliverable/decoded
            cp work/apktool/AndroidManifest.xml deliverable/decoded/
            cp -a work/apktool/res/xml deliverable/decoded/ 2>/dev/null || true
            cp -a work/apktool/assets deliverable/decoded/ 2>/dev/null || true
          fi
          find deliverable -maxdepth 4 -type f -printf '%P\t%s bytes\n' | sort \
            > deliverable/artifact_inventory.tsv
          du -sh deliverable

      - name: Upload decompilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-ai-decompile-evidence
          path: deliverable/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
