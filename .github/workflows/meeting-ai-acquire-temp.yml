name: Temporary Meeting.ai package inspection

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'meeting-ai-static-analysis-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install static-analysis tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y aapt apksigner apktool binutils file jq p7zip-full python3 ripgrep tree unzip zip
          JADX_URL="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name | test("jadx-[0-9].*\\.zip$")) | .browser_download_url' | head -1)"
          test -n "$JADX_URL"
          curl -fL --retry 3 --retry-all-errors "$JADX_URL" -o /tmp/jadx.zip
          sudo mkdir -p /opt/jadx
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version | tee /tmp/jadx-version.txt

      - name: Acquire and verify public installation package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/download work/xapk work/all-apk-unpacked result
          urls=(
            'https://d.apkpure.net/b/XAPK/ai.meeting.app?version=latest'
            'https://d.apkpure.com/b/XAPK/ai.meeting.app?version=latest'
            'https://d.cdnpure.com/b/XAPK/ai.meeting.app?version=latest'
            'https://d.apkpure.net/b/XAPK/ai.meeting.app?versionCode=844'
            'https://d.apkpure.com/b/XAPK/ai.meeting.app?versionCode=844'
            'https://d.cdnpure.com/b/XAPK/ai.meeting.app?versionCode=844'
            'https://d.apkpure.net/b/APK/ai.meeting.app?version=latest'
            'https://d.apkpure.com/b/APK/ai.meeting.app?version=latest'
            'https://d.cdnpure.com/b/APK/ai.meeting.app?version=latest'
          )
          found=''
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            out="work/download/candidate-${n}.bin"
            rm -f "$out"
            echo "Trying ${url%%\?*}"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 900 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
              -e 'https://apkpure.net/meeting-ai-ai-visual-notes/ai.meeting.app/download' \
              -H 'Accept: application/octet-stream,application/vnd.android.package-archive,*/*' \
              "$url" -o "$out"; then
              if unzip -tq "$out" >/dev/null 2>&1; then
                found="$out"
                printf '%s\n' "$url" > result/acquisition_source.txt
                break
              fi
            fi
          done
          test -n "$found"
          cp "$found" work/package.xapk
          sha256sum work/package.xapk | tee result/package_sha256.txt
          sha1sum work/package.xapk | tee result/package_sha1.txt
          file work/package.xapk | tee result/package_file_type.txt
          unzip -q work/package.xapk -d work/xapk
          find work/xapk -type f -printf '%P\t%s bytes\n' | sort > result/xapk_inventory.tsv

          base=''
          while IFS= read -r apk; do
            line="$(aapt dump badging "$apk" 2>/dev/null | head -1 || true)"
            if grep -q "package: name='ai.meeting.app'" <<<"$line" && ! grep -q " split='" <<<"$line"; then
              base="$apk"
              break
            fi
          done < <(find work/xapk -type f -name '*.apk' | sort)
          if [ -z "$base" ]; then
            base="$(find work/xapk -type f -name '*.apk' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)"
          fi
          test -n "$base"
          cp "$base" work/base.apk
          printf '%s\n' "$base" | tee result/base_apk_source_path.txt
          aapt dump badging work/base.apk | tee result/aapt_badging.txt
          aapt dump permissions work/base.apk | tee result/aapt_permissions.txt
          apksigner verify --verbose --print-certs work/base.apk | tee result/signing.txt
          sha256sum work/base.apk | tee result/base_apk_sha256.txt
          sha1sum work/base.apk | tee result/base_apk_sha1.txt

          while IFS= read -r apk; do
            name="$(basename "$apk" .apk)"
            mkdir -p "work/all-apk-unpacked/$name"
            unzip -q "$apk" -d "work/all-apk-unpacked/$name" || true
            aapt dump badging "$apk" 2>/dev/null | head -1 >> result/split_badging.txt || true
          done < <(find work/xapk -type f -name '*.apk' | sort)
          find work/all-apk-unpacked -type f -path '*/lib/*/*.so' -printf '%P\t%s bytes\n' | sort > result/native_libraries.tsv

      - name: Decode and decompile
        shell: bash
        continue-on-error: true
        run: |
          set -euxo pipefail
          apktool d -f work/base.apk -o work/apktool 2>&1 | tee result/apktool.log
          /opt/jadx/bin/jadx -j 4 --deobf --show-bad-code --comments-level WARN \
            -d work/jadx work/base.apk 2>&1 | tee result/jadx.log
          test -f work/apktool/AndroidManifest.xml && cp work/apktool/AndroidManifest.xml result/AndroidManifest.xml || true
          find work/jadx/sources -type f 2>/dev/null | wc -l | tee result/jadx_source_file_count.txt || true
          find work/apktool -type f 2>/dev/null | wc -l | tee result/apktool_file_count.txt || true

      - name: Extract code, SDK, storage, recording, and network evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p result/native-strings
          find work/all-apk-unpacked -type f -path '*/lib/*/*.so' -print0 | while IFS= read -r -d '' so; do
            out="result/native-strings/$(echo "$so" | sed 's#[/ ]#_#g').txt"
            strings -a -n 6 "$so" > "$out" || true
          done

          roots=()
          [ -d work/jadx/sources ] && roots+=(work/jadx/sources)
          [ -d work/jadx/resources ] && roots+=(work/jadx/resources)
          [ -d work/apktool ] && roots+=(work/apktool)
          roots+=(result/native-strings)

          rg -n -i --no-heading --max-count 300 \
            'AudioRecord|MediaRecorder|startForeground|FOREGROUND_SERVICE|recording|microphone|transcri|speaker|voice.?match|WebSocket|socket\.io|grpc|upload|multipart|meeting|calendar|oauth|billing|revenuecat|sharedpreferences|datastore|room|sqlite|encrypt|keystore|certificatepinner|networksecurityconfig' \
            "${roots[@]}" > result/relevant_code_hits.txt || true

          rg -o -I --no-filename 'https?://[^[:space:]"'"'<>\\]+' "${roots[@]}" \
            | sed -E 's/([?&](token|key|secret|sig|signature|auth|code)=)[^& ]+/\1<redacted>/Ig' \
            | sort -u > result/urls_redacted.txt || true

          rg -n -i --no-heading --max-count 1000 \
            'io\.flutter|libflutter|flutter_assets|com\.google\.firebase|firebase|sentry|appsflyer|posthog|clarity|amplitude|mixpanel|revenuecat|billingclient|onesignal|intercom|okhttp|retrofit|websocket|grpc|webrtc|livekit|deepgram|assemblyai|speechmatics|speech\.googleapis|cognitiveservices|transcribe\.amazonaws|api\.openai\.com|anthropic|agora|twilio' \
            "${roots[@]}" > result/technology_hits.txt || true

          rg -n -i --no-heading --max-count 500 \
            'allowBackup|usesCleartextTraffic|networkSecurityConfig|debuggable|exported="true"|grantUriPermissions|FileProvider|android:authorities' \
            work/apktool/AndroidManifest.xml work/apktool/res work/jadx/resources > result/security_config_hits.txt || true

          rg -n -i --no-heading --max-count 500 \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{16,}|api[_-]?key.{0,24}[=:].{0,80}|client[_-]?secret.{0,24}[=:].{0,80}|Bearer [A-Za-z0-9._-]{12,}' \
            "${roots[@]}" | sed -E 's/(AIza|sk-|Bearer )[A-Za-z0-9._-]+/\1<redacted>/g' > result/embedded_secret_pattern_hits_redacted.txt || true

          find work/jadx/sources -type f -name '*.java' 2>/dev/null \
            | sed 's#work/jadx/sources/##' | cut -d/ -f1-3 | sort | uniq -c | sort -nr > result/package_tree_counts.txt || true
          cp /tmp/jadx-version.txt result/jadx_version.txt

      - name: Build compact evidence archive
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p artifact
          cp -a result artifact/result
          cp work/base.apk artifact/base.apk 2>/dev/null || true
          cp work/package.xapk artifact/package.xapk 2>/dev/null || true
          [ -d work/jadx ] && tar -czf artifact/jadx-output.tar.gz -C work jadx || true
          [ -d work/apktool ] && tar -czf artifact/apktool-output.tar.gz -C work apktool || true
          find artifact -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort | tee artifact/ARTIFACT_INVENTORY.tsv
          echo '=== BADGING ==='; cat result/aapt_badging.txt 2>/dev/null || true
          echo '=== SIGNING ==='; cat result/signing.txt 2>/dev/null || true
          echo '=== PERMISSIONS ==='; cat result/aapt_permissions.txt 2>/dev/null || true
          echo '=== NATIVE LIBRARIES ==='; cat result/native_libraries.tsv 2>/dev/null || true
          echo '=== TECHNOLOGY HITS (first 120) ==='; head -120 result/technology_hits.txt 2>/dev/null || true
          echo '=== RELEVANT CODE HITS (first 160) ==='; head -160 result/relevant_code_hits.txt 2>/dev/null || true

      - name: Upload static-analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-ai-static-analysis-evidence
          path: artifact/
          if-no-files-found: error
          retention-days: 2
